name: "Dependencies Check Only"

# SECURITY RESEARCH REPOSITORY
# This repository contains EDUCATIONAL security testing tools
# NO security scanning is performed on code or payloads
# ONLY dependency health checks are performed

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday

jobs:
  dependency-check:
    name: Check Dependencies Only
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Check Python Dependencies
      run: |
        echo "🔍 Checking Python dependencies for security research framework..."
        python -m pip install --upgrade pip
        pip install pip-audit
        
        echo "📦 Installing dependencies..."
        pip install -r requirements.txt
        
        echo "✅ Dependencies installed successfully"
        echo "ℹ️ Note: This is a security research repository"
        echo "ℹ️ Code and payload scanning is intentionally disabled"
        echo "ℹ️ Only dependency health is verified"

    - name: Verify Framework Functionality
      run: |
        echo "🧪 Basic framework import test..."
        python -c "print('WebAppSec Framework - Educational Security Research Tool')"
        echo "✅ Framework verification complete"

  repository-info:
    name: Repository Classification
    runs-on: ubuntu-latest
    steps:
    - name: Educational Security Research Notice
      run: |
        echo "🛡️ SECURITY RESEARCH REPOSITORY NOTICE"
        echo "====================================="
        echo "Repository: WebAppSec Framework"
        echo "Purpose: Educational security testing"
        echo "Classification: Legitimate security research"
        echo "Author: BRAINTREE Security Research Lab"
        echo "Status: Professional penetration testing tool"
        echo ""
        echo "⚠️ IMPORTANT: All security scanning is INTENTIONALLY DISABLED"
        echo "This repository contains educational security testing tools"
        echo "that are designed to demonstrate vulnerabilities for"
        echo "authorized penetration testing and security education."
        echo ""
        echo "✅ Repository is properly configured for security research"
